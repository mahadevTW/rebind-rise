<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradVoice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F7FF"/>
      <stop offset="60%" stop-color="#E8F1FF"/>
      <stop offset="100%" stop-color="#DCE8FF"/>
    </linearGradient>
    <linearGradient id="cardGradVoice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="accentGradVoice" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="100%" stop-color="#4285FF"/>
    </linearGradient>
    <filter id="shadowVoice" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#102B59" flood-opacity="0.08"/>
    </filter>
    <pattern id="gridVoice" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#3478F6" stroke-width="0.8" stroke-opacity="0.12"/>
      <circle cx="0" cy="0" r="1.5" fill="#3478F6" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="720" height="450" fill="url(#bgGradVoice)"/>
  <rect width="720" height="450" fill="url(#gridVoice)"/>

  <!-- Subtle glow -->
  <circle cx="580" cy="180" r="160" fill="#3478F6" fill-opacity="0.12" filter="blur(40px)"/>

  <!-- Left Content Area -->
  <g transform="translate(48, 48)">
    <rect width="210" height="32" rx="16" fill="#FFFFFF" stroke="#DCE8FF" stroke-width="1.2" filter="url(#shadowVoice)"/>
    <circle cx="18" cy="16" r="4.5" fill="#3478F6"/>
    <circle cx="18" cy="16" r="8" fill="#3478F6" fill-opacity="0.25"/>
    <text x="32" y="21" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#102B59" letter-spacing="0.06em">LIVE-CODING MEETUP</text>
  </g>

  <!-- Title -->
  <text x="48" y="140" font-family="'Manrope', 'Inter', sans-serif" font-size="38" font-weight="800" fill="#102B59" letter-spacing="-0.03em">Build Your First</text>
  <text x="48" y="182" font-family="'Manrope', 'Inter', sans-serif" font-size="40" font-weight="900" fill="url(#accentGradVoice)" letter-spacing="-0.03em">Voice Agent</text>
  <text x="48" y="215" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#102B59" letter-spacing="-0.01em">Real-time Conversational AI with LiveKit &amp; WebRTC</text>
  <text x="48" y="240" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#64748B">Ultra low latency STT + LLM + TTS pipeline from scratch.</text>

  <!-- Meta Badges -->
  <g transform="translate(48, 275)">
    <!-- Date Badge -->
    <rect width="180" height="36" rx="8" fill="#FFFFFF" stroke="#DCE8FF" stroke-width="1.2"/>
    <path d="M16 12v12M28 12v12M12 16h20M12 24h20" stroke="#3478F6" stroke-width="1.6" stroke-linecap="round"/>
    <text x="42" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#102B59">26 SEPTEMBER 2026</text>
    
    <!-- Location Badge -->
    <g transform="translate(192, 0)">
      <rect width="130" height="36" rx="8" fill="#FFFFFF" stroke="#DCE8FF" stroke-width="1.2"/>
      <circle cx="18" cy="18" r="4" fill="#3478F6"/>
      <text x="30" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#102B59">Pune In-Person</text>
    </g>

    <!-- Free Badge -->
    <g transform="translate(332, 0)">
      <rect width="112" height="36" rx="8" fill="#EBF3FF" stroke="#3478F6" stroke-width="1.2"/>
      <text x="56" y="23" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#3478F6">Free Meetup</text>
    </g>
  </g>

  <!-- Key Topics Chips -->
  <g transform="translate(48, 332)">
    <rect width="108" height="26" rx="13" fill="#EBF3FF" stroke="#C8DCFF" stroke-width="1"/>
    <text x="54" y="17.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#102B59">LiveKit WebRTC</text>

    <g transform="translate(118, 0)">
      <rect width="100" height="26" rx="13" fill="#EBF3FF" stroke="#C8DCFF" stroke-width="1"/>
      <text x="50" y="17.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#102B59">Turn Detection</text>
    </g>

    <g transform="translate(228, 0)">
      <rect width="110" height="26" rx="13" fill="#EBF3FF" stroke="#C8DCFF" stroke-width="1"/>
      <text x="55" y="17.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#102B59">Sub-500ms TTS</text>
    </g>
  </g>

  <!-- Right Visual: Voice Waveform Card -->
  <g transform="translate(450, 48)" filter="url(#shadowVoice)">
    <rect width="222" height="340" rx="18" fill="url(#cardGradVoice)" stroke="#DCE8FF" stroke-width="1.5"/>

    <!-- Header bar -->
    <path d="M0 18 Q0 0 18 0 L204 0 Q222 0 222 18 L222 46 L0 46 Z" fill="#F2F7FF"/>
    <line x1="0" y1="46" x2="222" y2="46" stroke="#DCE8FF" stroke-width="1.2"/>
    <circle cx="20" cy="23" r="4.5" fill="#3478F6"/>
    <circle cx="34" cy="23" r="4.5" fill="#82AEFF"/>
    <text x="195" y="27" text-anchor="end" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#64748B" letter-spacing="0.05em">VOICE PIPELINE</text>

    <!-- Waveform Graphic -->
    <g transform="translate(18, 62)">
      <rect width="186" height="80" rx="10" fill="#F8FAFF" stroke="#DCE8FF" stroke-width="1.2"/>
      <!-- Soundwave bars -->
      <g transform="translate(18, 40)">
        <rect x="0" y="-12" width="4" height="24" rx="2" fill="#82AEFF"/>
        <rect x="8" y="-20" width="4" height="40" rx="2" fill="#3478F6"/>
        <rect x="16" y="-8" width="4" height="16" rx="2" fill="#82AEFF"/>
        <rect x="24" y="-28" width="4" height="56" rx="2" fill="#3478F6"/>
        <rect x="32" y="-16" width="4" height="32" rx="2" fill="#4285FF"/>
        <rect x="40" y="-32" width="4" height="64" rx="2" fill="#102B59"/>
        <rect x="48" y="-24" width="4" height="48" rx="2" fill="#3478F6"/>
        <rect x="56" y="-12" width="4" height="24" rx="2" fill="#82AEFF"/>
        <rect x="64" y="-30" width="4" height="60" rx="2" fill="#3478F6"/>
        <rect x="72" y="-18" width="4" height="36" rx="2" fill="#4285FF"/>
        <rect x="80" y="-8" width="4" height="16" rx="2" fill="#82AEFF"/>
        <rect x="88" y="-22" width="4" height="44" rx="2" fill="#102B59"/>
        <rect x="96" y="-34" width="4" height="68" rx="2" fill="#3478F6"/>
        <rect x="104" y="-20" width="4" height="40" rx="2" fill="#4285FF"/>
        <rect x="112" y="-10" width="4" height="20" rx="2" fill="#82AEFF"/>
        <rect x="120" y="-26" width="4" height="52" rx="2" fill="#3478F6"/>
        <rect x="128" y="-14" width="4" height="28" rx="2" fill="#82AEFF"/>
        <rect x="136" y="-6" width="4" height="12" rx="2" fill="#DCE8FF"/>
        <rect x="144" y="-18" width="4" height="36" rx="2" fill="#3478F6"/>
      </g>
    </g>

    <!-- Pipeline steps -->
    <g transform="translate(18, 156)">
      <rect width="186" height="50" rx="8" fill="#FFFFFF" stroke="#82AEFF" stroke-width="1.2"/>
      <circle cx="20" cy="25" r="9" fill="#EBF3FF"/>
      <path d="M17 25h6M20 22l3 3-3 3" stroke="#3478F6" stroke-width="1.5" stroke-linecap="round"/>
      <text x="36" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#3478F6">STEP 1: AUDIO STREAM</text>
      <text x="36" y="38" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#102B59">Deepgram / Whisper STT</text>
    </g>

    <g transform="translate(18, 214)">
      <rect width="186" height="50" rx="8" fill="#FFFFFF" stroke="#82AEFF" stroke-width="1.2"/>
      <circle cx="20" cy="25" r="9" fill="#EBF3FF"/>
      <path d="M17 25h6M20 22l3 3-3 3" stroke="#3478F6" stroke-width="1.5" stroke-linecap="round"/>
      <text x="36" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#3478F6">STEP 2: STREAMING LLM</text>
      <text x="36" y="38" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#102B59">Token Delta Execution</text>
    </g>

    <g transform="translate(18, 272)">
      <rect width="186" height="50" rx="8" fill="#102B59"/>
      <circle cx="20" cy="25" r="9" fill="#3478F6"/>
      <path d="m17 25 2 2 4-5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="36" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#82AEFF">STEP 3: SYNTHESIS</text>
      <text x="36" y="38" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Cartesia / ElevenLabs</text>
    </g>
  </g>

  <!-- Watermark logo -->
  <g transform="translate(48, 400)">
    <text font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#102B59" letter-spacing="0.05em">REBIND RISE <tspan fill="#3478F6">COMMUNITY</tspan></text>
  </g>
</svg>

