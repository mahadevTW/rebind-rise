<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMcp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F7FF"/>
      <stop offset="60%" stop-color="#E8F1FF"/>
      <stop offset="100%" stop-color="#DCE8FF"/>
    </linearGradient>
    <linearGradient id="cardGradMcp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="accentGradMcp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="100%" stop-color="#4285FF"/>
    </linearGradient>
    <filter id="shadowMcp" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#102B59" flood-opacity="0.08"/>
    </filter>
    <pattern id="gridMcp" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#3478F6" stroke-width="0.8" stroke-opacity="0.12"/>
      <circle cx="0" cy="0" r="1.5" fill="#3478F6" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="720" height="450" fill="url(#bgGradMcp)"/>
  <rect width="720" height="450" fill="url(#gridMcp)"/>

  <!-- Subtle glow -->
  <circle cx="580" cy="180" r="160" fill="#3478F6" fill-opacity="0.12" filter="blur(40px)"/>

  <!-- Left Content Area -->
  <g transform="translate(48, 48)">
    <rect width="220" height="32" rx="16" fill="#FFFFFF" stroke="#DCE8FF" stroke-width="1.2" filter="url(#shadowMcp)"/>
    <circle cx="18" cy="16" r="4.5" fill="#3478F6"/>
    <circle cx="18" cy="16" r="8" fill="#3478F6" fill-opacity="0.25"/>
    <text x="32" y="21" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#102B59" letter-spacing="0.06em">HANDS-ON WORKSHOP</text>
  </g>

  <!-- Title -->
  <text x="48" y="140" font-family="'Manrope', 'Inter', sans-serif" font-size="38" font-weight="800" fill="#102B59" letter-spacing="-0.03em">Build Your First</text>
  <text x="48" y="182" font-family="'Manrope', 'Inter', sans-serif" font-size="40" font-weight="900" fill="url(#accentGradMcp)" letter-spacing="-0.03em">MCP Server</text>
  <text x="48" y="215" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#102B59" letter-spacing="-0.01em">Model Context Protocol with Python &amp; FastMCP</text>
  <text x="48" y="240" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#64748B">Expose enterprise APIs, databases and custom tools to AI agents.</text>

  <!-- Meta Badges -->
  <g transform="translate(48, 275)">
    <!-- Date Badge -->
    <rect width="160" height="36" rx="8" fill="#FFFFFF" stroke="#DCE8FF" stroke-width="1.2"/>
    <path d="M16 12v12M28 12v12M12 16h20M12 24h20" stroke="#3478F6" stroke-width="1.6" stroke-linecap="round"/>
    <text x="42" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#102B59">11 JULY 2026</text>
    
    <!-- Location Badge -->
    <g transform="translate(172, 0)">
      <rect width="138" height="36" rx="8" fill="#FFFFFF" stroke="#DCE8FF" stroke-width="1.2"/>
      <circle cx="18" cy="18" r="4" fill="#3478F6"/>
      <text x="30" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#102B59">Online + Pune</text>
    </g>

    <!-- Free Badge -->
    <g transform="translate(322, 0)">
      <rect width="112" height="36" rx="8" fill="#EBF3FF" stroke="#3478F6" stroke-width="1.2"/>
      <text x="56" y="23" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#3478F6">Free Meetup</text>
    </g>
  </g>

  <!-- Key Topics Chips -->
  <g transform="translate(48, 332)">
    <rect width="100" height="26" rx="13" fill="#EBF3FF" stroke="#C8DCFF" stroke-width="1"/>
    <text x="50" y="17.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#102B59">FastMCP</text>

    <g transform="translate(110, 0)">
      <rect width="118" height="26" rx="13" fill="#EBF3FF" stroke="#C8DCFF" stroke-width="1"/>
      <text x="59" y="17.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#102B59">JSON-RPC 2.0</text>
    </g>

    <g transform="translate(238, 0)">
      <rect width="110" height="26" rx="13" fill="#EBF3FF" stroke="#C8DCFF" stroke-width="1"/>
      <text x="55" y="17.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#102B59">Tool Calling</text>
    </g>
  </g>

  <!-- Right Visual: MCP Architecture Diagram Card -->
  <g transform="translate(450, 48)" filter="url(#shadowMcp)">
    <rect width="222" height="340" rx="18" fill="url(#cardGradMcp)" stroke="#DCE8FF" stroke-width="1.5"/>

    <!-- Header bar -->
    <path d="M0 18 Q0 0 18 0 L204 0 Q222 0 222 18 L222 46 L0 46 Z" fill="#F2F7FF"/>
    <line x1="0" y1="46" x2="222" y2="46" stroke="#DCE8FF" stroke-width="1.2"/>
    <circle cx="20" cy="23" r="4.5" fill="#3478F6"/>
    <circle cx="34" cy="23" r="4.5" fill="#82AEFF"/>
    <text x="195" y="27" text-anchor="end" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#64748B" letter-spacing="0.05em">MCP SPECIFICATION</text>

    <!-- Host App / Client -->
    <g transform="translate(18, 62)">
      <rect width="186" height="60" rx="10" fill="#F8FAFF" stroke="#82AEFF" stroke-width="1.2"/>
      <text x="14" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#3478F6" letter-spacing="0.08em">AI CLIENT / HOST</text>
      <text x="14" y="44" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#102B59">Claude · Cursor · Agents</text>
    </g>

    <!-- Connector: JSON-RPC -->
    <line x1="111" y1="122" x2="111" y2="152" stroke="#3478F6" stroke-width="2" stroke-dasharray="3 3"/>
    <g transform="translate(66, 126)">
      <rect width="90" height="20" rx="10" fill="#FFFFFF" stroke="#3478F6" stroke-width="1"/>
      <text x="45" y="14" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#3478F6">JSON-RPC / stdio</text>
    </g>

    <!-- MCP Server (FastMCP) -->
    <g transform="translate(18, 160)">
      <rect width="186" height="74" rx="10" fill="#102B59"/>
      <text x="14" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#82AEFF" letter-spacing="0.08em">MCP SERVER</text>
      <text x="14" y="44" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Python FastMCP Server</text>
      <text x="14" y="62" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#C8DCFF">@mcp.tool() · @mcp.resource()</text>
    </g>

    <!-- Capabilities Bar -->
    <g transform="translate(18, 248)">
      <rect width="186" height="74" rx="10" fill="#FFFFFF" stroke="#DCE8FF" stroke-width="1.2"/>
      <text x="14" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#3478F6" letter-spacing="0.08em">CAPABILITIES</text>
      <g transform="translate(14, 34)">
        <rect width="48" height="24" rx="4" fill="#EBF3FF"/>
        <text x="24" y="16" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#102B59">Tools</text>
        <g transform="translate(54, 0)">
          <rect width="66" height="24" rx="4" fill="#EBF3FF"/>
          <text x="33" y="16" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#102B59">Resources</text>
        </g>
        <g transform="translate(126, 0)">
          <rect width="32" height="24" rx="4" fill="#EBF3FF"/>
          <text x="16" y="16" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#102B59">Eval</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Watermark logo -->
  <g transform="translate(48, 400)">
    <text font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#102B59" letter-spacing="0.05em">REBIND RISE <tspan fill="#3478F6">COMMUNITY</tspan></text>
  </g>
</svg>

