<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F7FF"/>
      <stop offset="60%" stop-color="#E8F1FF"/>
      <stop offset="100%" stop-color="#DCE8FF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="100%" stop-color="#102B59"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="100%" stop-color="#4285FF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#102B59" flood-opacity="0.08"/>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#3478F6" stroke-width="0.8" stroke-opacity="0.12"/>
      <circle cx="0" cy="0" r="1.5" fill="#3478F6" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="720" height="450" fill="url(#bgGrad)"/>
  <rect width="720" height="450" fill="url(#grid)"/>

  <!-- Subtle glow circles -->
  <circle cx="580" cy="180" r="160" fill="#4285FF" fill-opacity="0.12" filter="blur(40px)"/>
  <circle cx="140" cy="360" r="140" fill="#3478F6" fill-opacity="0.08" filter="blur(30px)"/>

  <!-- Left Content Area -->
  <!-- Top Badge -->
  <g transform="translate(48, 48)">
    <rect width="210" height="32" rx="16" fill="#FFFFFF" stroke="#DCE8FF" stroke-width="1.2" filter="url(#shadow)"/>
    <circle cx="18" cy="16" r="4.5" fill="#3478F6"/>
    <circle cx="18" cy="16" r="8" fill="#3478F6" fill-opacity="0.25"/>
    <text x="32" y="21" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#102B59" letter-spacing="0.06em">HANDS-ON MEETUP</text>
  </g>

  <!-- Title -->
  <text x="48" y="140" font-family="'Manrope', 'Inter', sans-serif" font-size="38" font-weight="800" fill="#102B59" letter-spacing="-0.03em">Understanding</text>
  <text x="48" y="182" font-family="'Manrope', 'Inter', sans-serif" font-size="40" font-weight="900" fill="url(#accentGrad)" letter-spacing="-0.03em">WTF is Jev?</text>
  <text x="48" y="215" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#102B59" letter-spacing="-0.01em">Production AI Systems &amp; Observability</text>
  <text x="48" y="240" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#64748B">Learn what it takes to ship reliable AI architectures at scale.</text>

  <!-- Meta Badges -->
  <g transform="translate(48, 275)">
    <!-- Date Badge -->
    <rect width="170" height="36" rx="8" fill="#FFFFFF" stroke="#DCE8FF" stroke-width="1.2"/>
    <path d="M16 12v12M28 12v12M12 16h20M12 24h20" stroke="#3478F6" stroke-width="1.6" stroke-linecap="round"/>
    <text x="40" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#102B59">10 OCTOBER 2026</text>
    
    <!-- Mode Badge -->
    <g transform="translate(182, 0)">
      <rect width="138" height="36" rx="8" fill="#FFFFFF" stroke="#DCE8FF" stroke-width="1.2"/>
      <circle cx="18" cy="18" r="4" fill="#3478F6"/>
      <text x="30" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#102B59">Online + Pune</text>
    </g>

    <!-- Fee Badge -->
    <g transform="translate(330, 0)">
      <rect width="112" height="36" rx="8" fill="#3478F6"/>
      <text x="56" y="23" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">₹999 / Seat</text>
    </g>
  </g>

  <!-- Key Topics Chips -->
  <g transform="translate(48, 332)">
    <rect width="118" height="26" rx="13" fill="#EBF3FF" stroke="#C8DCFF" stroke-width="1"/>
    <text x="59" y="17.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#102B59">AI Observability</text>

    <g transform="translate(128, 0)">
      <rect width="114" height="26" rx="13" fill="#EBF3FF" stroke="#C8DCFF" stroke-width="1"/>
      <text x="57" y="17.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#102B59">Runtime Evals</text>
    </g>

    <g transform="translate(252, 0)">
      <rect width="118" height="26" rx="13" fill="#EBF3FF" stroke="#C8DCFF" stroke-width="1"/>
      <text x="59" y="17.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#102B59">Production AI</text>
    </g>
  </g>

  <!-- Right Visual: Clean Technical Diagram Component -->
  <g transform="translate(450, 48)" filter="url(#shadow)">
    <!-- Base Diagram Card -->
    <rect width="222" height="340" rx="18" fill="url(#cardGrad)" stroke="#DCE8FF" stroke-width="1.5"/>

    <!-- Header bar -->
    <path d="M0 18 Q0 0 18 0 L204 0 Q222 0 222 18 L222 46 L0 46 Z" fill="#F2F7FF"/>
    <line x1="0" y1="46" x2="222" y2="46" stroke="#DCE8FF" stroke-width="1.2"/>
    <circle cx="20" cy="23" r="4.5" fill="#3478F6"/>
    <circle cx="34" cy="23" r="4.5" fill="#82AEFF"/>
    <circle cx="48" cy="23" r="4.5" fill="#DCE8FF"/>
    <text x="195" y="27" text-anchor="end" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#64748B" letter-spacing="0.05em">JEV ARCHITECTURE</text>

    <!-- Node 1: Input Stream -->
    <g transform="translate(18, 62)">
      <rect width="186" height="58" rx="10" fill="#FFFFFF" stroke="#3478F6" stroke-width="1.4"/>
      <text x="14" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#3478F6" letter-spacing="0.08em">RUNTIME LAYER</text>
      <text x="14" y="44" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#102B59">High-QPS Inference</text>
      <circle cx="166" cy="29" r="6" fill="#3478F6" fill-opacity="0.2"/>
      <circle cx="166" cy="29" r="3" fill="#3478F6"/>
    </g>

    <!-- Connector Line -->
    <line x1="111" y1="120" x2="111" y2="148" stroke="#3478F6" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="111,150 107,144 115,144" fill="#3478F6"/>

    <!-- Node 2: Observability & Tracing -->
    <g transform="translate(18, 154)">
      <rect width="186" height="66" rx="10" fill="#F8FAFF" stroke="#82AEFF" stroke-width="1.2"/>
      <text x="14" y="23" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#102B59" letter-spacing="0.08em">OBSERVABILITY ENGINE</text>
      <text x="14" y="42" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#3478F6">Trace · Guardrails · Metrics</text>
      <!-- Telemetry Sparkline -->
      <path d="M14 55 Q 35 48 55 54 T 95 48 T 135 53 T 172 47" fill="none" stroke="#3478F6" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Connector Line -->
    <line x1="111" y1="220" x2="111" y2="246" stroke="#3478F6" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="111,248 107,242 115,242" fill="#3478F6"/>

    <!-- Node 3: Production System -->
    <g transform="translate(18, 252)">
      <rect width="186" height="58" rx="10" fill="#102B59"/>
      <text x="14" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#82AEFF" letter-spacing="0.08em">PRODUCTION OUTPUT</text>
      <text x="14" y="44" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Reliable AI at Scale</text>
      <path d="m162 25 4 4 8-9" fill="none" stroke="#3478F6" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Watermark logo -->
  <g transform="translate(48, 400)">
    <text font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#102B59" letter-spacing="0.05em">REBIND RISE <tspan fill="#3478F6">COMMUNITY</tspan></text>
  </g>
</svg>
